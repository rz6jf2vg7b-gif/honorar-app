<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HonorarApp">
  <!-- Gleiche Marke wie das App-Symbol: Paragraphenzeichen im Akzent auf Ink,
       darunter die Regel des CD BR·03b. Als SVG, damit es in jeder Größe
       scharf bleibt — im Tab wird es auf 16 px heruntergerechnet. -->
  <rect width="64" height="64" rx="6" fill="#0a0a0a"/>
  <text x="32" y="43" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="42"
        font-weight="600" fill="#14b8a6">§</text>
  <rect x="12" y="44" width="40" height="2.5" fill="#ffffff"/>
</svg>
